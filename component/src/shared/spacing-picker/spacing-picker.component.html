<div class="picker-surface">
  <!-- Header -->
  <div class="picker-header">
    <div class="title">{{ title }}</div>

    <div class="actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="button" (click)="onOk()">OK</button>
    </div>
  </div>

  <!-- Cross Layout -->
  <div class="cross-grid" role="group">
    <!-- Top -->
    <div class="cell top">
      <label class="edge-label" for="edge-top">Top</label>
      <div class="edge-input">
        <button mat-icon-button type="button" (click)="nudge('top', -1)" aria-label="Decrease top">
          <mat-icon svgIcon="remove"></mat-icon>
        </button>
        <input
          id="edge-top"
          type="number"
          [ngModel]="draft.top"
          (ngModelChange)="onInput('top', $event)"
          inputmode="numeric"
          aria-label="Top value (px)"
        />
        <button mat-icon-button type="button" (click)="nudge('top', 1)" aria-label="Increase top">
          <mat-icon svgIcon="add"></mat-icon>
        </button>
        <span class="unit">px</span>
      </div>
    </div>

    <!-- Left -->
    <div class="cell left">
      <label class="edge-label" for="edge-left">Left</label>
      <div class="edge-input">
        <button mat-icon-button type="button" (click)="nudge('left', -1)" aria-label="Decrease left">
          <mat-icon svgIcon="remove"></mat-icon>
        </button>
        <input
          id="edge-left"
          type="number"
          [ngModel]="draft.left"
          (ngModelChange)="onInput('left', $event)"
          inputmode="numeric"
          aria-label="Left value (px)"
        />
        <button mat-icon-button type="button" (click)="nudge('left', 1)" aria-label="Increase left">
          <mat-icon svgIcon="add"></mat-icon>
        </button>
        <span class="unit">px</span>
      </div>
    </div>

    <!-- Center preview -->
    <div class="cell center">
      <div class="preview-box">
        <div class="preview-content">
          <div class="pv-title">{{ title }}</div>
          <div class="pv-values">
            {{draft.top}} / {{draft.right}} / {{draft.bottom}} / {{draft.left}} px
          </div>
        </div>
      </div>
    </div>

    <!-- Right -->
    <div class="cell right">
      <label class="edge-label" for="edge-right">Right</label>
      <div class="edge-input">
        <button mat-icon-button type="button" (click)="nudge('right', -1)" aria-label="Decrease right">
          <mat-icon svgIcon="remove"></mat-icon>
        </button>
        <input
          id="edge-right"
          type="number"
          [ngModel]="draft.right"
          (ngModelChange)="onInput('right', $event)"
          inputmode="numeric"
          aria-label="Right value (px)"
        />
        <button mat-icon-button type="button" (click)="nudge('right', 1)" aria-label="Increase right">
          <mat-icon svgIcon="add"></mat-icon>
        </button>
        <span class="unit">px</span>
      </div>
    </div>

    <!-- Bottom -->
    <div class="cell bottom">
      <label class="edge-label" for="edge-bottom">Bottom</label>
      <div class="edge-input">
        <button mat-icon-button type="button" (click)="nudge('bottom', -1)" aria-label="Decrease bottom">
          <mat-icon svgIcon="remove"></mat-icon>
        </button>
        <input
          id="edge-bottom"
          type="number"
          [ngModel]="draft.bottom"
          (ngModelChange)="onInput('bottom', $event)"
          inputmode="numeric"
          aria-label="Bottom value (px)"
        />
        <button mat-icon-button type="button" (click)="nudge('bottom', 1)" aria-label="Increase bottom">
          <mat-icon svgIcon="add"></mat-icon>
        </button>
        <span class="unit">px</span>
      </div>
    </div>
  </div>
</div>
