<h1 mat-dialog-title>{{ data?.title || 'Edit JSON Array Items' }}</h1>

<mat-dialog-content class="editor-dialog-content simple">
  <p class="section-title">Add New Item</p>

  <!-- One-line add row (consistent with parent row-grid-3-3-3-auto) -->
  <div class="row-grid-3-3-3-auto">
    <!-- Name -->
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input
        matInput
        [(ngModel)]="addName"
        (keydown.enter)="!canAdd() && addItem()" />
    </mat-form-field>

    <!-- Type -->
    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="addType">
        <mat-option *ngFor="let type of typeSelections" [value]="type.value">
          {{ type.viewValue }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Value -->
    <mat-form-field appearance="fill">
      <mat-label>Value</mat-label>
      <input
        matInput
        [(ngModel)]="addValue"
        (keydown.enter)="!canAdd() && addItem()" />
    </mat-form-field>

    <!-- Add button -->
    <button
      mat-flat-button
      color="primary"
      class="btn-pill"
      [disabled]="canAdd()"
      (click)="addItem()">
      <mat-icon svgIcon="add"></mat-icon>
    </button>
  </div>

  <p class="section-title">Current Items</p>

  <div>
    <div class="row-grid-3-3-3-auto" *ngFor="let element of items; let i = index; trackBy: trackByIndex">
      <!-- Name -->
      <mat-form-field appearance="fill">
        <input
          matInput
          [(ngModel)]="element.name"
          placeholder="Name" />
      </mat-form-field>

      <!-- Type -->
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select
          [(ngModel)]="element.type">
          <mat-option *ngFor="let type of typeSelections" [value]="type.value">
            {{ type.viewValue }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Value -->
      <mat-form-field appearance="fill">
        <mat-label>Value</mat-label>
        <input
          matInput
          [(ngModel)]="element.value"
          placeholder="Value" />
      </mat-form-field>

      <!-- Delete -->
      <button
        mat-icon-button
        color="warn"
        aria-label="Delete item"
        (click)="removeItem(element)">
        <mat-icon svgIcon="delete"></mat-icon>
      </button>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
