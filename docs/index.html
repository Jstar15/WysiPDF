<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WysiPDF Demo</title>
  <script src="./wysipdf.bundle.js"></script>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #125aa1;
    }
    /* Buttons */
    #downloadBtn, #downloadHtmlBtn {
      position: fixed;
      padding: 8px 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 9999;
    }
    #downloadBtn:hover, #downloadHtmlBtn:hover { background-color: var(--primary-hover); }
    #downloadBtn { bottom: 30px; right: 25px; }
    #downloadHtmlBtn { bottom: 30px; right: 145px; }
  </style>
</head>
<body>

<!-- Floating buttons -->
<button id="downloadHtmlBtn">Download HTML</button>
<button id="downloadBtn">Download PDF</button>

<!-- Host container for the editor -->
<div id="editor-host"></div>

<script>
  let currentPage = null;
  let wysi = null;

  // --- Inject page margins/styles into exported HTML ---
  function injectPageMargins(html, page) {
    const bg = (page && page.pageAttrs && page.pageAttrs.backgroundColor) || '#ffffff';
    const font = (page && page.pageAttrs && page.pageAttrs.defaultFont) || 'Roboto, Arial, sans-serif';
    const styleTag = `
<style id="wysi-export-margins">
  html { background: #f6f7f9; }
  body {
    margin: 32px auto !important;
    padding: 24px !important;
    max-width: 900px;
    background: ${bg};
    font-family: ${font};
    box-sizing: border-box;
  }
  @page { margin: 15mm; }
</style>`.trim();

    if (/<\/head>/i.test(html)) {
      return html.replace(/<\/head>/i, styleTag + '</head>');
    }
    if (!/<html/i.test(html)) {
      // If it's a fragment, wrap it into a minimal document
      return `<!doctype html><html><head>${styleTag}</head><body>${html}</body></html>`;
    }
    // Has <html> but maybe no <head>
    if (!/<head>/i.test(html)) {
      return html.replace(/<html([^>]*)>/i, `<html$1><head>${styleTag}</head>`);
    }
    return html;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    if (typeof WysiPDF === 'undefined') {
      console.error('WysiPDF class not found. Is wysipdf.bundle.js loaded correctly?');
      return;
    }

    // Create an instance mounted to our host container
    wysi = new WysiPDF({ mount: '#editor-host' });

    // Default starter page
    const page = {
      header: { rows: [] },
      content: { rows: [] },
      footer: { rows: [] },
      pageAttrs: {
        backgroundColor: 'white',
        marginTop: 10,
        marginRight: 0,
        marginLeft: 0,
        marginBottom: 10,
        footerMargin: 50,
        headerMargin: 30,
        defaultFont: 'Roboto'
      },
      tokenAttrs: [
        { name: 'customerName', value: 'John Doe', type: 'TEXT' }
      ],
      partialContent: [],
      colorPalettes: [
        '#000000', '#111827', '#1F2937', '#374151', '#4B5563',
        '#6B7280', '#9CA3AF', '#D1D5DB', '#E5E7EB', '#FFFFFF',
        '#1D4ED8', '#2563EB', '#3B82F6', '#6366F1', '#818CF8',
        '#0E7490', '#06B6D4', '#22D3EE', '#67E8F9',
        '#065F46', '#10B981', '#34D399', '#86EFAC',
        '#B45309', '#F59E0B', '#FBBF24', '#FB923C',
        '#B91C1C', '#EF4444', '#F87171', '#FCA5A5',
        '#BE185D', '#EC4899', '#F472B6', '#8B5CF6', '#A78BFA', '#DDD6FE'
      ]
    };

    currentPage = page;
    await wysi.loadPage(page);

    await wysi.onPageChange(updatedPage => {
      currentPage = updatedPage;
      console.log('Page was updated:', updatedPage);
    });

    // Download PDF
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      if (!currentPage) return;
      const tokens = currentPage.tokenAttrs || [];
      const base64 = await wysi.generatePdfBase64(currentPage, tokens);
      const link = document.createElement('a');
      link.href = 'data:application/pdf;base64,' + base64;
      link.download = 'wysipdf-document.pdf';
      link.click();
    });

    // Download HTML with injected margins
    document.getElementById('downloadHtmlBtn').addEventListener('click', async () => {
      if (!currentPage) return;
      const tokens = currentPage.tokenAttrs || [];
      const rawHtml = await wysi.generateHtml(currentPage, tokens);
      const html = injectPageMargins(rawHtml, currentPage);

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'wysipdf-document.html';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });
  });
</script>

</body>
</html>
