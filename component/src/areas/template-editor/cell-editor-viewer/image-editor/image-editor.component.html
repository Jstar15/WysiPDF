<div class="editor-dialog-content">
  <p class="section-title">Upload</p>
  <div class="row-grid-3-3-3-auto">
    <label class="file-label w-100">
      <span class="file-button">Choose Image</span>
      <input type="file" accept="image/*" (change)="onFileChange($event)" hidden />
    </label>

    <div class="file-info" *ngIf="filename">
      {{ filename }}
    </div>
  </div>

  <!-- Token-based image selection (IMAGE tokens only) -->
  <p class="section-title" *ngIf="imageTokens.length">Or select image token</p>
  <div class="row-grid-3-3-3-auto" *ngIf="imageTokens.length">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Image Token</mat-label>
      <mat-select [(ngModel)]="selectedTokenKey" (selectionChange)="onTokenChanged()">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let t of imageTokens" [value]="t.name">
          {{ t.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="imageBase64" class="preview-container">
    <p class="section-title">Preview</p>
    <img
      [src]="imageBase64"
      alt="preview"
      class="image-preview"
      [style.width.%]="width"
    />
  </div>
  <div *ngIf="selectedTokenKey && !imageBase64" class="file-info">
    Preview not available for this token value, but it will render at runtime.
  </div>

  <p class="section-title">Image Width (%)</p>
  <div class="row-grid-3-3-3-auto">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Width (%)</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="width"
        (ngModelChange)="onWidthChanged($event)"
        min="1"
        max="100"
        step="1"
        placeholder="100"
      />
    </mat-form-field>
  </div>

  <p class="section-title">Alignment</p>
  <div class="align-group">
    <mat-button-toggle-group [(ngModel)]="alignment" (change)="onAlignmentChanged()">
      <mat-button-toggle value="left">
        <mat-icon svgIcon="format_align_left"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="center">
        <mat-icon svgIcon="format_align_center"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="right">
        <mat-icon svgIcon="format_align_right"></mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>
