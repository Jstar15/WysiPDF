<div class="mainContainer">
    <as-split
            [direction]="'horizontal'"
            [gutterSize]="6"
            [unit]="'percent'"
            [disabled]="!showRightPane"
            class="split-container"
    >
        <!-- LEFT PANE -->
        <as-split-area [size]="50" [minSize]="25" class="left-pane">
            <mat-card class="editor-card mat-elevation-z4">
              <mat-card-header class="editor-toolbar">
                <div class="toolbar-row">

                  <!-- Left: history -->
                  <div class="history-panel btn-group">
                    <button
                      mat-mini-fab
                      (click)="undo()"
                      [disabled]="!canUndo()"
                      class="icon-btn"
                      aria-label="Undo"
                      matTooltip="Undo">
                      <mat-icon [ngStyle]="{ color: canUndo() ? 'inherit' : '#bdbdbd' }" svgIcon="undo"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      (click)="redo()"
                      [disabled]="!canRedo()"
                      class="icon-btn"
                      aria-label="Redo"
                      matTooltip="Redo">
                      <mat-icon [ngStyle]="{ color: canRedo() ? 'inherit' : '#bdbdbd' }" svgIcon="redo"></mat-icon>
                    </button>
                  </div>

                  <!-- Center: features -->
                  <div class="features-panel btn-group">
                    <button
                      mat-mini-fab
                      color="primary"
                      (click)="openEditorViewer(EditorType.IMPORT)"
                      class="icon-btn"
                      aria-label="Import / Export page"
                      matTooltip="Import / Export page">
                      <mat-icon svgIcon="file_open"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      color="primary"
                      (click)="openEditorViewer(EditorType.PAGE_LAYOUT)"
                      class="icon-btn"
                      aria-label="Edit page layout"
                      matTooltip="Edit page layout">
                      <mat-icon svgIcon="border_color"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      color="primary"
                      (click)="openEditorViewer(EditorType.COLOR_PALETTE)"
                      class="icon-btn"
                      aria-label="Edit color Palettes"
                      matTooltip="Edit color Palettes">
                      <mat-icon svgIcon="colors"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      color="primary"
                      (click)="openEditorViewer(EditorType.TOKEN)"
                      class="icon-btn"
                      aria-label="Manage tokens"
                      matTooltip="Manage tokens">
                      <mat-icon svgIcon="download"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      color="primary"
                      class="icon-btn"
                      (click)="openEditorViewer(EditorType.PRESET)"
                      [matTooltip]="'Load Preset'">
                      <mat-icon svgIcon="inventory_2"></mat-icon>
                    </button>
                  </div>


                  <!-- Right: view toggles -->
                  <div class="change-view-panel btn-group">
                    <button
                      mat-mini-fab
                      color="primary"
                      class="icon-btn"
                      (click)="togglePdfPane()"
                      [matTooltip]="showPdfViewPane ? 'Show JSON View' : 'Show PDF View'">
                      <mat-icon [svgIcon]="showPdfViewPane ? 'code' : 'picture_as_pdf'"></mat-icon>
                    </button>
                    <button
                      mat-mini-fab
                      color="primary"
                      class="icon-btn"
                      (click)="toggleRightPane()"
                      [matTooltip]="showRightPane ? 'Hide Preview' : 'Show Preview'">
                      <mat-icon [svgIcon]="showRightPane ? 'visibility_off' : 'visibility'"></mat-icon>
                    </button>

                  </div>

                </div>
              </mat-card-header>


                <mat-card-content>
                    <h3 style="margin: 16px 0 8px; display: flex; align-items: center;">
                        <mat-icon style="margin-right: 4px;" svgIcon="layers"></mat-icon> Page Content
                    </h3>
                    <mat-accordion>
                        <!-- HEADER -->
                        <mat-expansion-panel (opened)="onPanelOpened('header')">
                            <mat-expansion-panel-header>
                                <mat-panel-title>
                                    <mat-icon class="panel-icon" svgIcon="view_headline"></mat-icon>
                                    Header
                                </mat-panel-title>
                            </mat-expansion-panel-header>
                            <app-grid-editor
                                    *ngIf="this.area == 'header'"
                                    [area]="'header'"
                                    [grid]="page.header"
                                    [tokenAttrs]="page.tokenAttrs"
                                    [pageAttrs]="page.pageAttrs"
                                    [hidePageBreak]="true"
                                    [hideChart]="true"
                                    [hideBarcode]="true"
                                    [colorPalettes]="page.colorPalettes"
                                    (cellChange)="onCellChange($event)"
                                    (rowChange)="onRowChange($event)"
                            ></app-grid-editor>
                        </mat-expansion-panel>

                        <!-- CONTENT -->
                        <mat-expansion-panel (opened)="onPanelOpened('content')">
                            <mat-expansion-panel-header>
                                <mat-panel-title>
                                    <mat-icon class="panel-icon" svgIcon="subject"></mat-icon>
                                    Content
                                </mat-panel-title>
                            </mat-expansion-panel-header>
                            <app-grid-editor
                                    *ngIf="this.area == 'content'"
                                    [area]="'content'"
                                    [grid]="page.content"
                                    [tokenAttrs]="page.tokenAttrs"
                                    [pageAttrs]="page.pageAttrs"
                                    [colorPalettes]="page.colorPalettes"
                                    (cellChange)="onCellChange($event)"
                                    (rowChange)="onRowChange($event)"
                            ></app-grid-editor>
                        </mat-expansion-panel>

                        <!-- FOOTER -->
                        <mat-expansion-panel (opened)="onPanelOpened('footer')">
                            <mat-expansion-panel-header>
                                <mat-panel-title>
                                    <mat-icon class="panel-icon" svgIcon="text_snippet"></mat-icon>
                                    Footer
                                </mat-panel-title>
                            </mat-expansion-panel-header>
                            <app-grid-editor
                                    *ngIf="this.area == 'footer'"
                                    [area]="'footer'"
                                    [grid]="page.footer"
                                    [tokenAttrs]="page.tokenAttrs"
                                    [pageAttrs]="page.pageAttrs"
                                    [hidePageBreak]="true"
                                    [hideChart]="true"
                                    [hideBarcode]="true"
                                    [colorPalettes]="page.colorPalettes"
                                    (cellChange)="onCellChange($event)"
                                    (rowChange)="onRowChange($event)"
                            ></app-grid-editor>
                        </mat-expansion-panel>
                    </mat-accordion>
                </mat-card-content>
                <mat-card-actions class="history-toolbar-wrapper">

                </mat-card-actions>
            </mat-card>
        </as-split-area>

        <!-- RIGHT PANE -->
      <as-split-area [size]="50" [minSize]="25" *ngIf="showRightPane" class="right-pane">
        <app-pdf-viewer *ngIf="currentView == PanelTypes.PDF_VIEW"
                        class="pdf-viewer"
                        [base64]="this.pdfGenerationResult.base64">
        </app-pdf-viewer>

        <app-json-viewer *ngIf="currentView == PanelTypes.JSON_VIEW"
                         class="json-viewer"
                         [jsonList]="jsonList">
        </app-json-viewer>

        <app-editor-viewer  *ngIf="currentView == PanelTypes.PAGE_EDITOR"
                            [type]="editorType"
                            [page]="page"
                            (editorActionEvent)="closeEditors()">
        </app-editor-viewer>

        <app-cell-editor-viewer *ngIf="currentView == PanelTypes.CELL_EDITOR"
                                [type]="cellEditorType"
                                [tokens]="page.tokenAttrs"
                                [colorPalettes]="page.colorPalettes"
                                (editorActionEvent)="closeEditors()">
        </app-cell-editor-viewer>

        <app-row-editor-viewer *ngIf="currentView == PanelTypes.ROW_EDITOR"
          [type]="rowEditorType"
          [tokens]="page.tokenAttrs"
          (editorActionEvent)="closeEditors()">
        </app-row-editor-viewer>
      </as-split-area>

    </as-split>


</div>
