<div class="picker-surface">

  <!-- Header -->
  <div class="picker-header">
    <div class="title">{{ title }}</div>
    <div class="actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="button" (click)="onOk()">OK</button>
    </div>
  </div>

  <!-- Icon Grid -->
  <div class="icon-grid">
    <div
      *ngFor="let icon of icons"
      class="icon-cell"
      [class.selected]="isSelected(icon)"
      (click)="selectIcon(icon)">
      <mat-icon [svgIcon]="icon"  [style.color]="color" ></mat-icon>
    </div>
  </div>

</div>
