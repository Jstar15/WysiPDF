<div class="editor-dialog-content image-editor">

  <p class="section-title">Upload</p>
  <div class="upload-row">
    <button mat-stroked-button type="button" (click)="openFilePicker()">
      <mat-icon svgIcon="upload"></mat-icon>
      <span>Choose Image</span>
    </button>


    <div class="file-info" *ngIf="filename">{{ filename }}</div>

  </div>
  <p class="section-title">Or select an icon</p>
  <div class="flex">


    <div class="tool group split">
      <!-- Current color button -->
      <button mat-button class="btn-tight main"
              aria-label="Change color"
              (click)="openColorPicker()">
        <span class="swatch" [style.background]="color"></span>
      </button>

      <!-- Dropdown for palette -->
      <button mat-icon-button class="btn-tight caret-btn"
              [matMenuTriggerFor]="fillMenu"
              aria-label="Open fill menu">
        <mat-icon svgIcon="arrow_drop_down"></mat-icon>
      </button>

      <mat-menu #fillMenu="matMenu" class="palette-menu" xPosition="after" yPosition="below">
        <app-color-swatch-picker
          [color]="color"
          [customPalette]="colorAttrs"
          (colorSelect)="onColorSelected($event)">
        </app-color-swatch-picker>
      </mat-menu>
    </div>

    <div>
      <button mat-stroked-button type="button" (click)="openIconPicker()">
        <mat-icon svgIcon="upload"></mat-icon>
        <span>Choose Icon</span>
      </button>

      <app-icon-picker
        *ngIf="showIconPicker"
        [title]="'Bullet Icon'"
        [color]="color"
        (confirm)="handleIconOk($event)"
        (cancel)="handleIconCancel()">
      </app-icon-picker>
    </div>
  </div>



  <!-- Token-based image selection (IMAGE tokens only) -->
  <p class="section-title">Or select image token</p>
  <div  class="token-picker">
    <mat-form-field appearance="fill">
      <mat-label>Image Token</mat-label>
      <mat-select [(ngModel)]="selectedTokenKey" (selectionChange)="onTokenChanged()">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let t of imageTokens" [value]="t.name">
          {{ t.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Preview block -->
  <div class="preview-block" *ngIf="imageBase64 || selectedTokenKey">
    <p class="section-title">Preview</p>

    <div class="preview-frame" [ngClass]="alignment">
      <img
        *ngIf="imageBase64"
        [src]="imageBase64"
        alt="preview"
        class="image-preview"
        [style.width.%]="width"
      />
      <div *ngIf="selectedTokenKey && !imageBase64" class="no-preview">
        Preview not available for this token value.<br />
        It will render at runtime.
      </div>
    </div>

    <div class="preview-meta">{{ width }}% of frame width</div>
  </div>

  <p class="section-title">Image Width (%)</p>
  <div class="width-row">
    <mat-form-field appearance="fill">
      <mat-label>Width (%)</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="width"
        (ngModelChange)="onWidthChanged($event)"
        min="1"
        max="100"
        step="1"
        placeholder="100"
      />
    </mat-form-field>
  </div>

  <p class="section-title">Alignment</p>
  <div class="align-group">
    <mat-button-toggle-group [(ngModel)]="alignment" (change)="onAlignmentChanged()">
      <mat-button-toggle value="left" aria-label="Align left">
        <mat-icon svgIcon="format_align_left"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="center" aria-label="Align center">
        <mat-icon svgIcon="format_align_center"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="right" aria-label="Align right">
        <mat-icon svgIcon="format_align_right"></mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

</div>
