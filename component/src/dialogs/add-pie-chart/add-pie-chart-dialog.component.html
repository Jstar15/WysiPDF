<h1 mat-dialog-title>Insert Pie Chart</h1>

<div class="editor-dialog-content" mat-dialog-content>
      <!-- NEW: chart type -->
  <p class="section-title">Type</p>
  <div class="row-grid">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Chart type</mat-label>
      <mat-select [(ngModel)]="chartKind" (selectionChange)="onChartTypeChange($event.value)">
        <mat-option value="pie">Pie</mat-option>
        <mat-option value="doughnut">Doughnut</mat-option>
        <mat-option value="bar">Bar</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  
  <p class="section-title">Data</p>

  <div class="row-grid">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Select numeric tokens</mat-label>
      <mat-select multiple [(ngModel)]="selectedAttributeNames"
                  (selectionChange)="onAttributesChange($event.value)">
        <mat-option *ngFor="let t of numericTokens" [value]="t.name">
          {{ t.name }} ({{ t.value }})
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="slices.length" class="labels-editor">
    <p class="section-title small">Labels</p>
    <div class="label-row" *ngFor="let s of slices">
      <div class="label-attr">{{ s.attributeName }}</div>
      <mat-form-field appearance="fill" class="label-input">
        <mat-label>Label</mat-label>
        <input matInput [(ngModel)]="s.label" (ngModelChange)="onLabelChange()" />
      </mat-form-field>
    </div>
  </div>

  <p class="section-title">Title</p>
  <div class="row-grid">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Chart title</mat-label>
      <input matInput [(ngModel)]="title" (ngModelChange)="onTitleChange()" />
    </mat-form-field>
  </div>

  <p class="section-title">Preview</p>
  <div class="preview-container">
    <!-- Single two-way binding; the component will regenerate imageBase64 -->
    <app-chart-image-renderer [(chartBlock)]="chartBlock"></app-chart-image-renderer>
  </div>

  <div class="row-grid controls-row">
    <mat-form-field appearance="fill">
      <mat-label>Width (%)</mat-label>
      <input matInput type="number" min="1" max="100" [(ngModel)]="width" (ngModelChange)="rebuildPreview()" />
    </mat-form-field>

    <div class="align-field">
      <span class="align-label">Alignment</span>
      <mat-button-toggle-group [(ngModel)]="alignment" (ngModelChange)="rebuildPreview()" exclusive>
        <mat-button-toggle value="left"><mat-icon svgIcon="format_align_left"></mat-icon></mat-button-toggle>
        <mat-button-toggle value="center"><mat-icon svgIcon="format_align_center"></mat-icon></mat-button-toggle>
        <mat-button-toggle value="right"><mat-icon svgIcon="format_align_right"></mat-icon></mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!saveEnabled">Save</button>
</div>
