<h1 mat-dialog-title>
  Add Hyperlink
</h1>

<div mat-dialog-content>
  <div class="dialog-container">
    <mat-form-field appearance="fill">
      <mat-label>Hyperlink text</mat-label>
      <input id="textField" matInput [(ngModel)]="hyperLinkPayload.text" maxlength="200" required autocomplete="off">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Hyperlink url</mat-label>
      <input id="urlField" matInput [(ngModel)]="hyperLinkPayload.url" maxlength="200" required autocomplete="off">
    </mat-form-field>
  </div>

</div>

<div mat-dialog-actions>
  <button id="btnCancel" mat-flat-button [mat-dialog-close]="false">Cancel</button>
  <button id="btnConfirm" mat-flat-button color="primary" [disabled]="isDisabled()" [mat-dialog-close]="hyperLinkPayload">Ok</button>
</div>
