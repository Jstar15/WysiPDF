<div class="editor-dialog-content barcode-editor">

  <!-- Text + Type + Generate on one row -->
  <p class="section-title">Barcode</p>
  <div class="row-grid-1fr-1fr-auto">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Text</mat-label>
      <input
        matInput
        [(ngModel)]="textValue"
        (keyup.enter)="tryGenerate()"
        placeholder="Enter text for barcode"
      />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="selectedFormat">
        <mat-option *ngFor="let f of availableFormats" [value]="f.value">
          {{ f.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button color="primary" (click)="tryGenerate()" [disabled]="isGenerating">
      <mat-icon svgIcon="upload"></mat-icon>
      <span>{{ isGenerating ? 'Generating…' : 'Generate' }}</span>
    </button>
  </div>

  <!-- Token selection -->
  <p class="section-title" *ngIf="barcodeTokens.length">Or select token</p>
  <div class="row-grid-1fr">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Token</mat-label>
      <mat-select [(ngModel)]="selectedTokenKey" (selectionChange)="onTokenChanged()">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let t of barcodeTokens" [value]="t.name">
          {{ t.name }} <span *ngIf="t.value">— "{{ t.value }}"</span>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Errors -->
  <div *ngIf="errorMsg" class="file-info error-msg">{{ errorMsg }}</div>

  <!-- Preview (fixed frame like image editor) -->
  <div class="preview-block" *ngIf="imageBase64 || selectedTokenKey">
    <p class="section-title">Preview</p>

    <div class="preview-frame" [ngClass]="alignment">
      <img
        *ngIf="imageBase64"
        [src]="imageBase64"
        alt="barcode preview"
        class="image-preview"
        [style.width.%]="width"
      />
      <div *ngIf="selectedTokenKey && !imageBase64 && !errorMsg" class="no-preview">
        Preview not available for this token value.<br />
        It will render at runtime.
      </div>
    </div>

    <div class="preview-meta">{{ width }}% of frame width</div>
  </div>

  <!-- Display width -->
  <p class="section-title">Display Width (%)</p>
  <div class="row-grid-1fr">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Width (%)</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="width"
        (ngModelChange)="onWidthChanged($event)"
        min="1"
        max="100"
        placeholder="100"
      />
    </mat-form-field>
  </div>

  <!-- Alignment -->
  <p class="section-title">Alignment</p>
  <div class="align-group">
    <mat-button-toggle-group [(ngModel)]="alignment" (change)="onAlignmentChanged()">
      <mat-button-toggle value="left" aria-label="Align left">
        <mat-icon svgIcon="format_align_left"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="center" aria-label="Align center">
        <mat-icon svgIcon="format_align_center"></mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="right" aria-label="Align right">
        <mat-icon svgIcon="format_align_right"></mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

</div>
