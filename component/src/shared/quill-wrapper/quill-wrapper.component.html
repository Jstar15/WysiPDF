 <div [id]="toolbarId" class="quill-toolbar">
  <span class="ql-formats">
    <button class="ql-bold"></button>
    <button class="ql-italic"></button>
    <button class="ql-underline"></button>
  </span>

  <span class="ql-formats">
    <button type="button" class="ql-align" value=""></button>
    <button type="button" class="ql-align" value="center"></button>
    <button type="button" class="ql-align" value="right"></button>
  </span>

<span class="ql-formats">
  <select class="ql-size">
    <option value="9px">9</option>
    <option value="10px">10</option>
    <option value="11px">11</option>
    <option value="12px" selected>12</option>
    <option value="14px">14</option>
    <option value="16px">16</option>
    <option value="18px">18</option>
    <option value="24px">24</option>
    <option value="32px">32</option>
    <option value="48px">48</option>
    <option value="72px">72</option>
    <option value="90px">90</option>
  </select>
</span>

  <span class="ql-formats">
      <select class="ql-font">
      <option value="roboto" selected>Roboto</option>
      <option value="raleway">Raleway</option>
      <option value="nunito">Nunito</option>
      <option value="cormorant">Cormorant</option>
      </select>
  </span>
  <span class="ql-formats">
      <button class="ql-list" value="bullet"></button>
    </span>

   <span class="ql-formats">
  <!-- Background color -->
  <select class="ql-background">
    <option selected="selected"></option>
    <ng-container *ngFor="let color of colorPalettes">
      <option value="{{ color }}"></option>
    </ng-container>
  </select>

     <!-- Text color -->
  <select class="ql-color">
    <option selected="selected"></option>
    <ng-container *ngFor="let color of colorPalettes">
      <option value="{{ color }}"></option>
    </ng-container>
  </select>
</span>


  <span class="ql-formats">
    <button type="button" class="ql-clean"></button>
  </span>

  <span  class="ql-formats">
    <button id="custom-button-1-2" (click)="addTable(1,2)">1x2</button>
    <button id="custom-button-1-3" (click)="addTable(1,3)">1x3</button>
    <button id="custom-button-1-4" (click)="addTable(1,4)">1x4</button>
    <button id="custom-button-delete" (click)="deleteTable()">R</button>
  </span>

  <span  class="ql-formats">
    <button id="custom-button-attribute-adder" (click)="openDialog()">A</button>
  </span>
</div>

 <!-- Editor container (MUST match editorId exactly) -->
 <div [id]="editorId" class="quill-editor"></div>
